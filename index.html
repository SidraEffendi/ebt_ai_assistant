<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EBT Voice Assistant</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="shell" aria-label="EBT voice assistant">
        <header class="topbar">
          <div>
            <h1>EBT Voice Assistant</h1>
            <p id="statusText">Ready</p>
          </div>
          <div class="top-actions">
            <button id="listenButton" class="primary-button" type="button">Start listening</button>
          </div>
        </header>

        <div id="recordingBanner" class="recording-banner is-idle">
          <span></span>
          <strong id="recordingText">Idle</strong>
        </div>

        <section id="chatLog" class="chat-log" aria-live="polite" aria-label="Conversation log"></section>

        <form id="textForm" class="composer">
          <input
            id="textInput"
            type="text"
            autocomplete="off"
            placeholder="Type a message"
            aria-label="Message"
          />
          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
