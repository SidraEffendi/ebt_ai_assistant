<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EBT Voice Assistant</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="shell" aria-label="EBT voice assistant">
        <header class="topbar">
          <div>
            <h1>EBT Voice Assistant</h1>
            <p id="statusText">Ready</p>
          </div>
          <button id="micButton" class="mic-button" type="button" aria-label="Start voice input">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Z"></path>
              <path d="M19 11a7 7 0 0 1-14 0"></path>
              <path d="M12 18v4"></path>
              <path d="M8 22h8"></path>
            </svg>
          </button>
        </header>

        <div id="recordingBanner" class="recording-banner" hidden>
          <span></span>
          Recording
        </div>

        <section id="chatLog" class="chat-log" aria-live="polite" aria-label="Conversation log"></section>

        <form id="textForm" class="composer">
          <input
            id="textInput"
            type="text"
            autocomplete="off"
            placeholder="Type a message if voice is unavailable"
            aria-label="Message"
          />
          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
