<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EBT Voice Assistant</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="shell" aria-label="EBT voice assistant">
        <header class="topbar">
          <div>
            <h1>EBT Voice Assistant</h1>
            <p id="statusText">Waiting for Python agent</p>
          </div>
          <div class="top-actions">
            <button id="enableVoiceButton" class="enable-button" type="button">Enable voice input</button>
            <div id="connectionPill" class="connection-pill">Offline</div>
          </div>
        </header>

        <div id="recordingBanner" class="recording-banner is-idle">
          <span></span>
          <strong id="recordingText">Idle</strong>
        </div>

        <section id="chatLog" class="chat-log" aria-live="polite" aria-label="Conversation log"></section>
      </section>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
